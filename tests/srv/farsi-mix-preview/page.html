<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRV Farsi Mix — preview</title>
<style>
:root{--text:#e8ecf4;--dim:#8b9cc4;--gold:#c9a84c;--bg:#0a0d14}body{margin:0;background:var(--bg);color:var(--text);font-family:Syne,system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{color:var(--gold);letter-spacing:2px;font-size:12px}header .badge{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.5);color:#f59e0b;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:800}
main{max-width:1280px;margin:0 auto;padding:16px 20px 60px}.note{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--dim)}
nav{display:flex;gap:8px;margin:12px 0}nav button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:inherit;border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}nav button.on{border-color:var(--gold);color:var(--gold)}
video{max-width:100%;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#000}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}.grid2 figure{margin:0}.grid2 figcaption{font-size:11px;color:var(--dim);margin-top:4px}.grid2 canvas,.grid2 img{width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.12);display:block}
</style></head><body>
<header><b>SRV FARSI MIX</b><span class="badge">PREVIEW ONLY — not in production</span><span style="font-size:12px;color:var(--dim)">Sample songs use real Persian titles and the real SRV Farsi cover library; audio and durations are SAMPLE data.</span></header>
<main><nav id="nav"></nav><div id="view"></div></main>
<script type="module" src="/preview/app.mjs"></script></body></html>
